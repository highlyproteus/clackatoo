# The unit tests, as upstream runs them (offline; skips the tests known to fail). No native code is built.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testRunTestsUnitTest

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
