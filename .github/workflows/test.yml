# The unit tests, as upstream runs them (offline; skips the tests known to fail), and a host build of the
# native dictionary engine that decodes a few synthetic swipes (tools/gesture-eval).
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testRunTestsUnitTest :catalog:testDebugUnitTest :models:testDebugUnitTest

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'

  gesture-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Provides the JNI headers the engine sources include (no JVM is linked or started).
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Build the gesture harness
        run: |
          cmake -S tools/gesture-eval -B build/gesture-eval -DCMAKE_BUILD_TYPE=Release
          cmake --build build/gesture-eval -j"$(nproc)"

      - name: Swipe a few words through the built-in decoder
        run: build/gesture-eval/gesture_eval --dict app/src/main/assets/dicts/main_en-US.dict --selftest
