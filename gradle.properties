android.useAndroidX=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx1024m
# Clackatoo: AGP 9 creates unit tests only for the tested build type (debug). The runTests build type,
# which skips tests known to fail, needs them too for upstream's CI command `testRunTestsUnitTest`.
android.onlyEnableUnitTestForTheTestedBuildType=false
